name: macOS Desktop CI/CD

on:
  push:
    paths:
      - 'macos/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/macos.yml'
    branches:
      - main
      - develop
  pull_request:
    paths:
      - 'macos/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/macos.yml'
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS Desktop Build
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop Target
        run: flutter config --enable-macos-desktop

      - name: Fetch Dependencies
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run Tests
        run: flutter test

      - name: Build macOS Application
        run: flutter build macos --release

      - name: Package macOS Application Archive
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../aquawild-macos-standalone.zip AquaWild.app

      - name: Upload macOS Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aquawild-standalone-macos-app
          path: aquawild-macos-standalone.zip
