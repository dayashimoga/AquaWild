name: Windows Desktop CI/CD

on:
  push:
    paths:
      - 'windows/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/windows.yml'
    branches:
      - main
      - develop
  pull_request:
    paths:
      - 'windows/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/windows.yml'
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 Desktop Build
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Target
        run: flutter config --enable-windows-desktop

      - name: Fetch Dependencies
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run Tests
        run: flutter test

      - name: Build Windows Release Executable
        run: flutter build windows --release

      - name: Package Windows Binary Zip
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath aquawild-windows-release.zip

      - name: Upload Windows Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aquawild-standalone-windows-x64
          path: aquawild-windows-release.zip
