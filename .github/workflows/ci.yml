name: CI Tests & Code Quality

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Flutter Analyze & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Environment & Flutter Doctor
        run: flutter doctor -v

      - name: Fetch Pub Dependencies
        run: flutter pub get

      - name: Enforce Zero-Warning Static Analysis
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Security & Secret Hygiene Scan
        run: |
          echo "Scanning for hardcoded secrets, unauthorized private keys, or credentials..."
          if grep -r -E "sk-[a-zA-Z0-9]{32,}" lib/ ; then
            echo "::error::Hardcoded OpenAI secret key pattern detected!"
            exit 1
          fi
          echo "Secret scan passed cleanly. Zero exposed secrets."

      - name: Execute Full Automated Test Suite
        run: flutter test --coverage

      - name: Upload Test Coverage LCOV Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aquawild-test-coverage
          path: coverage/lcov.info
          retention-days: 7
