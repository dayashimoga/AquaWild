name: Linux Desktop CI/CD

on:
  push:
    paths:
      - 'linux/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/linux.yml'
    branches:
      - main
      - develop
  pull_request:
    paths:
      - 'linux/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/linux.yml'
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x64 Desktop Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Linux Toolchain & GTK3 Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Setup Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop Target
        run: flutter config --enable-linux-desktop

      - name: Fetch Dependencies
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run Tests
        run: flutter test

      - name: Build Linux Desktop Release
        run: flutter build linux --release

      - name: Package Linux Binary Archive
        run: |
          tar -czvf aquawild-linux-standalone.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aquawild-standalone-linux-x64
          path: aquawild-linux-standalone.tar.gz
