version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 0
    commit-message:
      prefix: 'ci'

  - package-ecosystem: 'pub'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 0
    commit-message:
      prefix: 'deps'
